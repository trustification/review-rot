# GitHub App credentials for API access
github:
  app_id: 5394558
  installation_id: 173361691

sources:
  # All repos under these orgs are included automatically (all authors)
  orgs:
    # - name: trustification

  # Additional repos outside the orgs above
  # Prefix a repo with + to watch ALL authors (like an org repo)
  # Without +, only PRs from team members in 'authors' are shown
  repos:
    - +RHEcosystemAppEng/sdlc-plugins
    - +guacsec/trustify-da-javascript-client
    - +guacsec/trustify-dependency-analytics

# Reviewer leaderboard settings
leaderboard:
  # Data horizon: how many days of review history to aggregate. This is the
  # widest range the leaderboard can show; the dashboard's interval selector
  # narrows it further client-side. Defaults to 90 if omitted.
  window_days: 90

# Approvals needed for "Ready for review" to hide a PR. Defaults to 2.
required_approvals: 2

# Team members — PRs from these authors are always shown,
# even in repos outside the orgs above.
#
# Expanding groups is supported using "@orgname/teamname" syntax. The app 
# will need permissions to read the org's members in order to read your
# teams.
# authors:
  # - ruromero
